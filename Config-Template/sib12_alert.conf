# SIB12 Emergency Alert configuration for rt-mbms-tx
# Loaded at runtime via SIGUSR1 (activate) / SIGUSR2 (cancel)
# Place this file next to sib.conf (default location) or set enb_files.sib12_alert
#
# References: 3GPP TS 36.331 s6.3.1 SystemInformationBlockType12-r9
#             ETWS: 3GPP TS 23.041; CMAS: 3GPP TS 22.268
#
# message_identifier: 16-bit ETWS/CMAS message ID (hex)
#   ETWS earthquake:      0x1100-0x1101
#   ETWS tsunami:         0x1102-0x1103
#   ETWS test:            0x1104
#   CMAS presidential:    0x1112
#   CMAS extreme:         0x1113-0x1114
#   CMAS severe:          0x1115-0x111A
#   CMAS Amber:           0x111B
# serial_number: 16-bit serial (hex) — upper 2 bits: geo-scope, lower 14: message code + update
# data_coding_scheme: per 3GPP TS 23.038 — 0x48 = GSM 7-bit default alphabet (Class 1)
# warning_msg_segment_type: "lastSegment" or "notLastSegment"
# warning_msg_segment_num: 0-63 (segment index, 0 for single-segment messages)
# warning_msg_segment_r9: hex-encoded CBS message payload (TS 23.041 s9.4.2.2)
#   Just the packed 7-bit-alphabet (or UCS-2) message bytes -- there is NO CBS page
#   header or length prefix. LTE handles segmentation via the separate
#   warning_msg_segment_num/warning_msg_segment_type fields, not an embedded length byte.

sib12_alert = {
    message_identifier  = 0x1102;       # ETWS tsunami warning
    serial_number       = 0x3000;
    data_coding_scheme  = 0x48;         # GSM 7-bit default alphabet
    warning_msg_segment_type = "lastSegment";
    warning_msg_segment_num  = 0;

    # Example: "Emergency Alert" (15 characters) encoded in GSM 7-bit alphabet, no
    # length prefix, no CBS page header -- generated with:
    #   python3 tools/encode_sib12_alert.py "Emergency Alert"
    warning_msg_segment_r9 = "C576597E2EBBC77950905D96D301";
};
